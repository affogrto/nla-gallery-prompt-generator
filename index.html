<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NLA Gallery Prompt Generator</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="series">NLA Gallery</p>
          <h1>象徴を一枚へ浸透させるプロンプト生成器</h1>
        </div>
        <div class="hero-actions">
          <button id="generateButton" class="primary-button" type="button">ランダム生成</button>
          <button id="copyButton" class="ghost-button" type="button">コピー</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="control-panel" aria-label="生成設定">
          <div class="panel-header">
            <div>
              <p class="section-kicker">Generate Setting</p>
              <h2>今回の設定</h2>
            </div>
            <button id="resetButton" class="text-button" type="button">初期化</button>
          </div>

          <div id="fieldControls" class="field-list"></div>

          <details class="editor-block">
            <summary>ランダム候補を編集</summary>
            <p>
              1行につき1候補です。保存すると次回から同じ候補リストを使えます。
            </p>
            <label>
              編集する項目
              <select id="poolSelect"></select>
            </label>
            <textarea id="poolEditor" spellcheck="false"></textarea>
            <div class="editor-actions">
              <button id="savePoolButton" class="ghost-button" type="button">候補を保存</button>
              <button id="restorePoolButton" class="text-button" type="button">この項目を初期値へ</button>
            </div>
          </details>
        </aside>

        <section class="output-panel" aria-label="生成結果">
          <div class="motif-board">
            <div class="motif-mark" aria-hidden="true">NLA</div>
            <div>
              <p class="section-kicker">Only One Symbol</p>
              <h2 id="motifName">-</h2>
            </div>
            <dl class="motif-meaning">
              <div>
                <dt>象徴</dt>
                <dd id="selectedMotif">-</dd>
              </div>
              <div>
                <dt>構成</dt>
                <dd>Character-focused</dd>
              </div>
              <div>
                <dt>質感</dt>
                <dd>Matte / Low noise</dd>
              </div>
            </dl>
          </div>
          <div class="output-meta">
            <span>生成されたプロンプト</span>
            <span id="copyStatus" role="status" aria-live="polite"></span>
          </div>
          <textarea id="promptOutput" class="prompt-output" spellcheck="false"></textarea>
          <footer class="output-status">
            <span id="promptStats">0 chars / 0 lines</span>
            <span>Print-ready prompt</span>
          </footer>
        </section>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
